# nginx HTTPS 설정
# 기존 강의의 sparta.conf 와 같은 역할. listen 443 ssl 로 HTTPS 를 받는다.
#
# - 443 : HTTPS 의 기본 포트
# - ssl_certificate / ssl_certificate_key : gen-cert.sh 로 만든 자체서명 인증서/키
#   (docker-compose 가 ./certs 를 컨테이너의 /etc/nginx/ssl 로 마운트한다)

# HTTP(80) 로 들어오면 그대로 받아서 안내 페이지를 보여준다.
server {
    listen 80;
    server_name localhost;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }
}

# HTTPS(443) — SSL 적용 핵심
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/dingco-ssl.crt;
    ssl_certificate_key /etc/nginx/ssl/dingco-ssl.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }
}
