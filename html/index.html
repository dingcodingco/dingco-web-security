<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>딩코랩스 - HTTPS 실습</title>
  <style>
    body { font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
           display: flex; align-items: center; justify-content: center;
           min-height: 100vh; margin: 0; background: #0f1115; color: #e7e9ee; }
    .card { text-align: center; padding: 48px 56px; border-radius: 16px;
            background: #1a1d24; box-shadow: 0 8px 40px rgba(0,0,0,.4); }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .lock { font-size: 56px; }
    p { color: #9aa0ac; margin: 6px 0; }
    code { background:#2a2f3a; padding:2px 6px; border-radius:6px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="lock">🔒</div>
    <h1>HTTPS 실습 성공!</h1>
    <p>딩코랩스 — nginx + openssl 자체서명 인증서</p>
    <p>지금 이 페이지는 <code>https://localhost</code> 로 안전하게 전송되었습니다.</p>
  </div>
</body>
</html>
