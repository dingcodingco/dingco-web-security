# 로컬에서 nginx 웹서버를 띄운다. (goorm IDE 대체)
#
# 예전에는 goorm 같은 클라우드 IDE 에 Ubuntu 서버를 만들고 apt-get 으로 nginx 를
# 설치했지만, 이제는 Docker 로 내 컴퓨터 위에 nginx 컨테이너를 한 줄로 띄운다.
#
# 실행:   docker compose up -d
# 종료:   docker compose down
#
# 포트 매핑(-p):  호스트포트:컨테이너포트
#   - 80:80   →  http://localhost
#   - 443:443 →  https://localhost   (HTTPS 기본 포트)
# 443 포트가 이미 사용 중이거나 권한 문제가 나면 "8443:443" 으로 바꾸고
# https://localhost:8443 으로 접속하면 된다.
services:
  web:
    image: nginx:alpine
    container_name: dingco-ssl
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./html:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/ssl:ro
